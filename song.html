<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1310">
<title>听山歌 · 云游山歌</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        background: radial-gradient(circle at 50% 12%, #23342a 0%, #12180f 55%, #0a0d08 100%);
        color: #f2f2ef; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "微软雅黑", "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 34px 26px calc(30px + env(safe-area-inset-bottom)); min-height: 100%;
        overflow: hidden;
    }
    .ring { position: fixed; border: 1px solid rgba(180, 220, 170, .16); border-radius: 50%; pointer-events: none; }
    .ring.a { width: 300px; height: 300px; top: -110px; left: -110px; }
    .ring.b { width: 460px; height: 460px; bottom: -240px; right: -180px; }
    .wrap { width: 100%; max-width: 420px; text-align: center; position: relative; z-index: 2; }
    .kicker { font-size: 12px; letter-spacing: 5px; color: #91a98d; margin-bottom: 16px; }
    h1 { font-size: 27px; letter-spacing: 6px; font-weight: 700; margin-bottom: 10px; }
    .sub { font-size: 12.5px; color: #93a08c; line-height: 1.9; margin-bottom: 32px; }

    .play {
        width: 116px; height: 116px; border-radius: 50%; border: none; margin: 0 auto 22px; display: block;
        background: linear-gradient(145deg, #57c178, #22984c); color: #fff; font-size: 42px; line-height: 1;
        cursor: pointer; box-shadow: 0 12px 34px rgba(38, 160, 84, .45), inset 0 -3px 10px rgba(0, 0, 0, .18);
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .play:active { transform: scale(.94); }
    .play.loading { opacity: .72; }

    .bar { width: 100%; height: 4px; background: rgba(255, 255, 255, .13); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #57c178, #9fd8a8); border-radius: 3px; transition: width .2s linear; }
    .time { display: flex; justify-content: space-between; font-size: 11px; color: #7f9180; margin-bottom: 26px; font-variant-numeric: tabular-nums; }

    .tip { font-size: 12.5px; line-height: 1.9; color: #8d998a; min-height: 20px; }
    .tip b { color: #cdd9c6; font-weight: 600; }

    .foot { margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .foot a {
        font-size: 12px; color: #b9c9b2; text-decoration: none; padding: 9px 18px;
        border: 1px solid rgba(185, 201, 178, .28); border-radius: 22px;
    }

    audio { display: none; }
    .idle-note { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11px; color: #3f4b3d; z-index: 1; }
</style>
</head>
<body>
<div class="ring a"></div>
<div class="ring b"></div>

<div class="wrap">
    <div class="kicker">云 游 山 歌</div>
    <h1>听一段山歌</h1>
    <p class="sub">这张明信片背面的红框里，就是这一段声音<br>点一下圆钮，山歌就响起来了</p>

    <button class="play" id="play" aria-label="播放山歌">▶</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="time"><span id="cur">0:00</span><span id="dur">--:--</span></div>
    <div class="tip" id="tip">正在准备音频…</div>

    <div class="foot">
        <a href="./create.html">我也做一张</a>
        <a href="./">看更多明信片</a>
    </div>
</div>
<div class="idle-note">云游山歌 · 数字明信片</div>

<audio id="bgm" preload="auto" playsinline webkit-playsinline loop>
    <source id="src1" src="./shange.mp3" type="audio/mpeg">
    <source id="src2" src="./shange.wav" type="audio/wav">
</audio>

<script>
(function () {
    'use strict';
    var audio = document.getElementById('bgm');
    var playBtn = document.getElementById('play');
    var prog = document.getElementById('prog');
    var cur = document.getElementById('cur');
    var dur = document.getElementById('dur');
    var tip = document.getElementById('tip');

    /* ?u= 可以换成任意音频直链（换成别的山歌录音时用） */
    var u = /(?:^|[?&])u=([^&]+)/.exec(location.search);
    if (u) {
        var src2 = document.getElementById('src2');
        src2.src = decodeURIComponent(u[1]);
    }

    function fmt(s) {
        if (!s || !isFinite(s)) return '--:--';
        var m = Math.floor(s / 60), r = Math.floor(s % 60);
        return m + ':' + (r < 10 ? '0' : '') + r;
    }

    function setBtn(playing) { playBtn.textContent = playing ? '❚❚' : '▶'; }

    playBtn.addEventListener('click', function () {
        if (audio.paused) {
            var p = audio.play();
            if (p && p.catch) p.catch(function () {
                tip.innerHTML = '<b>浏览器拦住了自动播放</b><br>请再点一次圆钮';
            });
        } else {
            audio.pause();
        }
    });

    audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', function () {
        cur.textContent = fmt(audio.currentTime);
        if (audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
    });
    audio.addEventListener('play', function () {
        setBtn(true); playBtn.classList.remove('loading');
        tip.innerHTML = '<b>山歌正在播放</b><br>可以多点几次，跟着唱';
    });
    audio.addEventListener('pause', function () { setBtn(false); });
    audio.addEventListener('ended', function () { setBtn(false); prog.style.width = '0%'; });
    audio.addEventListener('error', function () {
        tip.innerHTML = '<b>音频没加载出来</b><br>需要歌手录音放在站点根目录（shange.wav）';
    });

    /* 进来先尝试自动播放，被拦就给提示 */
    playBtn.classList.add('loading');
    var p = audio.play();
    if (p && p.then) {
        p.then(function () { playBtn.classList.remove('loading'); })
         .catch(function () {
             playBtn.classList.remove('loading');
             tip.innerHTML = '<b>点一下圆钮就能听</b><br>手机浏览器需要你亲手点一次';
         });
    }
})();
</script>
</body>
</html>
